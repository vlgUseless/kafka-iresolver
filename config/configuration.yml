administration:
  connectorType: JIRA
  processors: [issues, documentation, rule-engine]
  reporters: [html]
  parallelExecution: false
vectorizer:
  batchSize: 100
  iterations: 1
  epochs: 20
  layerSize: 100
  learningRate: 0.025
  minWordFrequency: 2
  sampling: 0.0005
  windowSize: 5
  topResults: 5
  language: English
processors:
  issues:
    dataSetFile: data/Issues_DataSet.txt
    vectorModelFile: data/Issues_VectorModel.zip
    overwriteMode: false
  documentation:
    dataSetFile: data/Documentation_DataSet.txt
    vectorModelFile: data/Documentation_VectorModel.zip
    docsMetadataFile: data/Documentation_Metadata.txt
    docsListFile: data/Documentation_List.txt
    docsFolder: docs/
  ruleEngine:
    rulesLocation: file:rules/*.drl
    autoExecution: false
reporters:
  html:
    openBrowser: false
    htmlTemplateFileName: html-report-template.vm
    outputFile: output/report.html
